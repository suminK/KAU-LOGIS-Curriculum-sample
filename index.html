<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>KAU 물류 교육과정</title>
  <script>
    /* Set the theme before first paint: saved choice, else the device setting. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("kau-logis-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <p class="eyebrow">한국항공대학교 · 물류전공</p>
        <h1>교육과정 한눈에 보기</h1>
      </div>
      <div class="controls">
        <button type="button" class="theme-btn" id="theme">
          <svg class="sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.2v1.9M10 15.9v1.9M2.2 10h1.9M15.9 10h1.9M4.5 4.5l1.3 1.3M14.2 14.2l1.3 1.3M4.5 15.5l1.3-1.3M14.2 5.8l1.3-1.3"/></svg>
          <svg class="moon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M16.6 12.3A7 7 0 0 1 7.7 3.4a.6.6 0 0 0-.8-.7 7.6 7.6 0 1 0 10.4 10.4.6.6 0 0 0-.7-.8Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="bar">
    <div class="wrap">
      <div class="bar-row">
        <input id="q" type="search" autocomplete="off" placeholder="과목명, 키워드 검색" aria-label="과목명, 키워드 검색">
        <button type="button" class="more-btn" id="more-btn" aria-expanded="false" aria-controls="more">
          <span>필터</span><span class="count" id="f-count" hidden></span>
        </button>
      </div>
      <div class="chips" id="f-tags"></div>
      <div class="more" id="more" inert>
        <div class="more-inner">
          <div class="filter-rows">
            <div class="row"><span class="row-label">학년</span><div class="seg" id="f-year"></div></div>
            <div class="row"><span class="row-label">구분</span><div class="seg" id="f-type"></div></div>
            <div class="row" id="row-lang"><span class="row-label">강의언어</span><div class="seg" id="f-lang"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="wrap">
    <p id="sample" class="sample" hidden>프로토타입용 샘플 데이터입니다. 실제 교과목과 다릅니다.</p>
    <div class="summary">
      <span id="count"></span>
      <button type="button" id="reset" class="link" hidden>필터 초기화</button>
    </div>
    <div id="list"></div>
    <p id="updated" class="updated"></p>
  </main>

  <dialog id="detail" aria-labelledby="d-title"></dialog>

  <script src="data/courses.js"></script>
  <script src="app.js"></script>
</body>
</html>
