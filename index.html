<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>2026 물류전공 교과목 리스트 (샘플)</title>
  <script>
    /* Set the theme before first paint: saved choice, else light. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("kau-logis-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20261125-3">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <p class="eyebrow">한국항공대학교</p>
        <h1>2026 물류전공 교과목 리스트 <span class="sample-pill">샘플</span></h1>
      </div>
      <div class="controls">
        <button type="button" class="theme-btn" id="theme">
          <svg class="sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.2v1.9M10 15.9v1.9M2.2 10h1.9M15.9 10h1.9M4.5 4.5l1.3 1.3M14.2 14.2l1.3 1.3M4.5 15.5l1.3-1.3M14.2 5.8l1.3-1.3"/></svg>
          <svg class="moon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M16.6 12.3A7 7 0 0 1 7.7 3.4a.6.6 0 0 0-.8-.7 7.6 7.6 0 1 0 10.4 10.4.6.6 0 0 0-.7-.8Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="bar">
    <div class="wrap">
      <div class="bar-row">
        <input id="q" type="search" autocomplete="off" placeholder="과목명, 키워드 검색" aria-label="과목명, 키워드 검색">
      </div>
      <div class="chips" id="f-tags"></div>
      <div class="filter-rows">
        <button type="button" id="f-open" class="switch" role="switch" aria-checked="false" hidden>
          <span class="switch-track" aria-hidden="true"></span><span><span id="f-open-term">이번 학기</span> 개설<span class="u"> 과목만</span></span>
        </button>
        <div class="row"><span class="row-label">학년</span><div class="seg" id="f-year"></div></div>
        <div class="row"><span class="row-label">학기</span><div class="seg" id="f-sem"></div></div>
        <div class="row" id="row-lang"><span class="row-label">강의언어</span><div class="seg" id="f-lang"></div></div>
      </div>
    </div>
  </div>

  <main class="wrap">
    <div id="check" class="check" hidden></div>
    <p id="sample" class="sample" hidden>검토용 샘플 페이지입니다. 과목 설명, 담당교수, 선수·관련 과목은 임시로 넣은 예시이며 학점·이수구분 등 일부 정보가 빠져 있습니다. 공식 교육과정은 학과 홈페이지에서 확인하세요.</p>
    <div class="summary">
      <span id="count"></span>
      <button type="button" id="reset" class="link" hidden>필터 초기화</button>
    </div>
    <div id="list"></div>
    <footer class="foot">
      <p id="updated"></p>
      <p id="contact" hidden></p>
    </footer>
  </main>

  <dialog id="detail" aria-labelledby="d-title"></dialog>

  <!-- change the v= value on all three lines whenever a file changes, so browsers fetch the new one -->
  <script src="data/courses.js?v=20261125-3"></script>
  <script src="sheet.js?v=20261125-3"></script>
</body>
</html>
